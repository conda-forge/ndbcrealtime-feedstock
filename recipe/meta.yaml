{% set name = "ndbcrealtime" %}
{% set version = "0.0.6" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/ndbcrealtime-{{ version }}.tar.gz
  sha256: 0215716eae75d20d631ae19d84b697dfd389ca25aa0c605129120b557f3618d0

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}
    - aiohttp
    - xmltodict

test:
  imports:
    - ndbcrealtime
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/djtimca/ndbc-api
  summary: NDBC Real Time Buoy Observation Data Wrapper.
  license: Apache-2.0
  license_file:
    - LICENSE.txt
    - LICENSE

extra:
  recipe-maintainers:
    - ocefpaf
